forge_version = 1.20.1-47.3.3
min_forge_version = 1.20.1-47.0.0
forge_config_api_port_version=8.0.1
cloth_config_version=11.1.136
quilt_loader_version = 0.27.1-beta.1
quilted_fabric_api_version = 7.6.0+0.92.2-1.20.1

# Development Utilities
emi_version = 1.1.18+1.20.1

# publishing
dry_run = true
curse_id =
modrinth_id =
release_type = release
game_versions = 1.20.1
mod_environment = both
mod_fabric_loaders = fabric,quilt
mod_modrinth_depends = amber,architectury-api,forge-config-api-port
mod_curse_depends = amber-lib,architectury-api,forge-config-api-port-fabric
